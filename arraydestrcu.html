<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
<h1>Opreations</h1>
<h2>Array Destructions</h2>

    <p id="demo"></p>

<script>

const fruits = ["Banana", "Orange", "Apple", "Mango"];


let [fruit1, fruit2] = fruits;

// Display Primitive Data
document.getElementById("demo").innerHTML = fruit1 + ", " + fruit2;
</script>
