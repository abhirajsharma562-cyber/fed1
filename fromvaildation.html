<!DOCTYPE html>
<html>
<head>
    <title>Simple Form Validation</title>
     
   
</head>
<body>

<div style="border: 1px solid black; padding: 50px; margin: 50px;width: 200px; background-color: antiquewhite;">
    <form onsubmit="return validateForm()">
         <label for="Name">Name</label>
        <input type="text" id="name" placeholder="Name"><br><br>
        <label for="Email">Email</label>
        <input type="email" id="email" placeholder="Email"><br><br>
        <label for="Name">Password</label>
        <input type="password" id="password" placeholder="Password"><br><br>
         <label for="Name">Comformpassword</label>
        <input type="password" id="conformpassword" placeholder="Conformpassword"><br><br>
        <label for="number"> Mobile Number</label>
        <input type="text" id="mobile number" placeholder="Mobile number"><br><br>
        <button type="submit">Submit</button>
        <p id="irror"></p>

    </form>
    </div>
<script>
function validateForm() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;
    let mobile = document.getElementById("mobile").value;

    // 1. Empty check
    if (name == "" || email == "" || password == "" || confirm == "" || mobile == "") {
        console.log("All fields are required");
        alert("Please enter your name");
        return false;
    }

    // 2. Email format
    if (!email.includes("@") || !email.includes(".")) {
        console.log("Invalid email format");
        alert("Please enter your email");
        return false;
    }

    // 3. Password length
    if (password.length < 6) {
        console.log("Password must be at least 6 characters");
        alert("Please enter your password")
        return false;
    }

    // 4. Confirm password
    if (password !== confirm) {
        console.log("Passwords do not match");
        return false;
    }

    // 5. Mobile number (10 digits)
    if (mobile.length != 10 || isNaN(mobile)) {
        console.log("Invalid mobile number");
        return false;
    }

    // 6. Success
    console.log("Form submitted successfully!");
    alert("Please Submit the form");
    return true;
}
</script>

</body>
</html>
