<body>
  <script>const student = {
  firstName: "Abhiraj",
  middleName:"kumar",
  lastName: "Sharma",

  // Getter
  get fullName() {
    return this.firstName + " " + this.middleName+""+ this.lastName;
  },

  // Setter
  set fullName(name) {
    const parts = name.split(" ");
    this.firstName = parts[0];
    this.middleName=parts[1];
    this.lastName = parts[2];
  }
};

student.fullName = "Abhiraj kumar Sharma"

console.log(student.firstName); 
console.log(student.middleName);
console.log(student.lastName);  
// Output: Smith
document.write(student.firstName);
document.write(student.middleName);
document.write(student.lastName);


</script>
</body>
